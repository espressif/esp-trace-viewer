# Run the GitLab test jobs on GitHub, so that Dependabot pull requests get
# checked. Keep the jobs in sync with .gitlab-ci.yml.
#
# Keep the e2e image tag in lockstep with the @playwright/test version in
# package.json. A Dependabot bump of that package fails e2e until the tag is
# updated, because the image only contains the browsers of its own version.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test:unit

  e2e:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v7
      - run: npm ci --no-audit --no-fund
      - run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-results
          retention-days: 7
          path: |
            test-results/
            playwright-report/

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: web
          retention-days: 7
          path: dist/web/
